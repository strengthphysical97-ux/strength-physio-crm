<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Strength Physio CRM - Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <!-- LOGO -->

            <div class="login-logo">

                <div class="logo-icon">
                    SP
                </div>

                <div>
                    <h2>Strength Physio</h2>
                    <span>CRM System</span>
                </div>

            </div>


            <!-- HEADING -->

            <div class="login-heading">

                <h1>Welcome Back</h1>

                <p>
                    Login to your CRM account
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="login-field">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="login-field">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>


            <div class="login-footer">

                <span>
                    © 2026 Strength Physio CRM
                </span>

            </div>

        </div>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("loginPassword")
                        .value;


                const message =
                    document
                        .getElementById("loginMessage");


                message.innerText =
                    "Logging in...";


                try {

                    const response =
                        await fetch("/api/auth/login", {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                email: email,

                                password: password

                            })

                        });


                    const data =
                        await response.json();


                    if (!data.success) {

                        message.innerText =
                            data.message ||
                            "Invalid email or password.";

                        return;

                    }


                    // SAVE LOGIN INFORMATION

                    localStorage.setItem(
                        "crmToken",
                        data.token
                    );


                    localStorage.setItem(
                        "crmUser",
                        JSON.stringify(data.user)
                    );


                    // GO TO DASHBOARD

                    window.location.href =
                        "dashboard.html";


                } catch (error) {

                    console.error(
                        "Login Error:",
                        error
                    );


                    message.innerText =
                        "Server error. Please try again.";

                }

            }
        );

    </script>

</body>

</html>
