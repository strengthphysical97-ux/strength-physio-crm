<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Strength Physio CRM - Customers</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <nav class="crm-nav">

            <a href="dashboard.html">📊 Dashboard</a>

            <a href="leads.html">👥 Leads</a>

            <a href="customers.html">🧑 Customers</a>

            <a href="orders.html">📦 Orders</a>

        </nav>

        <div class="page-header">

            <h1>Customers</h1>

            <a href="add-customer.html">
                <button type="button">Add Customer</button>
            </a>

        </div>

        <div class="list-toolbar">
            <input type="text" id="searchCustomer" placeholder="Search by name, phone or company...">
            <select id="customerStaffFilter"><option value="all">All Staff</option></select>
            <button type="button" id="clearCustomerFilters" class="secondary-btn">Clear</button>
        </div>
        <div class="list-summary" id="customerSummary"></div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Company / Clinic</th>
                        <th>City</th>
                        <th>Staff</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="customersTable">

                    <tr>
                        <td colspan="7">Loading customers...</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <script src="js/app.js"></script>
<script>
(function(){
 const input=document.getElementById("searchCustomer"), staff=document.getElementById("customerStaffFilter"), clear=document.getElementById("clearCustomerFilters");
 let rows=[];
 async function init(){
   try{ const r=await apiFetch("/api/customers"), d=await r.json(); if(!d.success) return; rows=d.customers||[];
     const u=JSON.parse(localStorage.getItem("crmUser")||"null");
     if(u?.role!=="admin"){ staff.style.display="none"; } else { const sr=await apiFetch("/api/users/staff"), sd=await sr.json(); if(sd.success) staff.innerHTML="<option value=\"all\">All Staff</option>"+sd.users.map(x=>`<option value="${x._id}">${x.name}</option>`).join(""); }
     render();
   }catch(e){console.error(e)}
 }
 function render(){ const q=(input.value||"").toLowerCase().trim(), sf=staff.value; const f=rows.filter(c=>(!q||[c.name,c.phone,c.email,c.company,c.city].filter(Boolean).join(" ").toLowerCase().includes(q))&&(sf==="all"||String(c.assignedTo?._id||c.assignedTo||"")===sf)); document.getElementById("customerSummary").innerHTML=`<span><b>${f.length}</b> customers shown</span>`; displayCustomers(f); }
 input.addEventListener("input",render); staff.addEventListener("change",render); clear.addEventListener("click",()=>{input.value="";staff.value="all";render()}); init();
})();
</script>

</body>

</html>
