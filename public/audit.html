<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Log — Strength Physio CRM</title><link rel="stylesheet" href="css/style.css"></head><body><div class="crm-layout"><aside class="crm-sidebar"><div class="crm-logo"><div class="logo-icon">SP</div><div><h2>Strength Physio</h2><span>CRM Command Center</span></div></div><div class="sidebar-section"><p class="sidebar-title">ADMIN</p><a class="sidebar-link" href="dashboard.html">⌂ <span>Dashboard</span></a><a class="sidebar-link" href="reports.html">▥ <span>Reports</span></a><a class="sidebar-link" href="staff.html">♙ <span>Staff</span></a><a class="sidebar-link active" href="audit.html">◌ <span>Audit Log</span></a></div></aside><main class="crm-main"><header class="crm-header"><div><p class="eyebrow">CONTROL & SECURITY</p><h1>Audit Log</h1><p class="dashboard-subtitle">A chronological record of important CRM actions.</p></div></header><div class="panel"><div class="panel-header"><div><h2>Recent Activity</h2><p>Admin-only visibility</p></div></div><div class="table-container"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></div></main></div><script>const t=localStorage.getItem('crmToken'),u=JSON.parse(localStorage.getItem('crmUser')||'{}');if(!t||u.role!=='admin')location.href='dashboard.html';const e=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));fetch('/api/audit',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json()).then(d=>{document.getElementById('rows').innerHTML=(d.logs||[]).map(x=>`<tr><td>${new Date(x.createdAt).toLocaleString('en-IN')}</td><td>${e(x.user?.name||'System')}</td><td><span class="staff-badge">${e(x.action)}</span></td><td>${e(x.entity)}</td><td>${e(x.details)}</td></tr>`).join('')||'<tr><td colspan="5">No activity yet.</td></tr>'}).catch(()=>document.getElementById('rows').innerHTML='<tr><td colspan="5">Unable to load audit log.</td></tr>');</script></body></html>
