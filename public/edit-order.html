<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Order - Strength Physio CRM</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <nav class="crm-nav">

        <a href="dashboard.html">📊 Dashboard</a>
        <a href="leads.html">👥 Leads</a>
        <a href="customers.html">🧑 Customers</a>
        <a href="orders.html">📦 Orders</a>
        <a href="payments.html">💰 Payments</a>

    </nav>

    <h1>Edit Order</h1>

    <form id="editOrderForm">

        <label>Customer</label>

        <select id="customer" required>
            <option value="">Select Customer</option>
        </select>


        <label>Lead Source</label>
        <select id="source" required>
            <option value="Instagram">Instagram</option><option value="IndiaMART">IndiaMART</option><option value="Justdial">Justdial</option><option value="Meta Ads">Meta Ads</option><option value="WhatsApp">WhatsApp</option><option value="Website">Website</option><option value="Referral">Customer Referral</option><option value="Facebook">Facebook</option><option value="Google">Google</option><option value="Other">Other</option>
        </select>
        <label>Source Type / Content</label>
        <select id="sourceType"><option value="">Not specified</option><option>Post</option><option>Reel / Video</option><option>Paid Advertisement</option><option>Story</option><option>Direct Message</option><option>Call</option><option>Organic</option><option>Other</option></select>
        <label>Campaign / Post Name <span class="optional-label">(Optional)</span></label>
        <input type="text" id="campaignName" placeholder="e.g. October laser ad campaign">

        <label>Product</label>
        <input type="text" id="product" required>

        <label>Quantity</label>
        <input type="number" id="quantity" min="1" required>

        <label>Price</label>
        <input type="number" id="price" min="0" required>

        <label>Delivery Charge <span class="optional-label">(Optional)</span></label>
        <input type="number" id="deliveryCharge" min="0" value="0" step="0.01">

        <label>GST <span class="optional-label">(Optional)</span></label>
        <div class="inline-fields">
            <label class="checkbox-label"><input type="checkbox" id="gstEnabled"> Add GST</label>
            <input type="number" id="gstPercent" min="0" max="100" step="0.01" value="18" placeholder="GST %" disabled>
        </div>

        <label>Total Amount</label>
        <input type="number" id="totalAmount" min="0" step="0.01" required readonly>

        <label>Payment Status</label>
        <select id="paymentStatus" disabled>
            <option value="Pending">Pending</option>
            <option value="Partial">Partial</option>
            <option value="Paid">Paid</option>
        </select>

        <div class="payment-summary" style="border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0">
            <p><strong>Previous payment received:</strong> ₹<span id="previousPaidDisplay">0.00</span></p>
            <label for="additionalPayment">New payment receiving now (₹)</label>
            <input type="text" id="additionalPayment" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*" value="0" autocomplete="off" placeholder="Enter amount using keyboard">
            <label for="newPaymentDate">Payment received date</label>
            <input type="date" id="newPaymentDate">
            <p><strong>Total paid after this payment:</strong> ₹<span id="totalPaidDisplay">0.00</span></p>
            <p><strong>Pending amount:</strong> ₹<span id="pendingAmountDisplay">0.00</span></p>
            <input type="hidden" id="previousAmountPaid" value="0">
            <input type="hidden" id="amountPaid" value="0">
        </div>
        <p id="paymentPendingInfo" class="muted-block">Enter only the new amount being received now. Previous payments are kept automatically.</p>
        <div id="paymentHistoryList" style="margin:8px 0 16px"></div>
        <div id="customerHistoryPanel" style="margin:8px 0 16px"></div>
<label>Order Status</label>

        <select id="orderStatus">

            <option value="New">New</option>
            <option value="Processing">Processing</option>
            <option value="Dispatched">Dispatched</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>

        </select>

        <label>Order Date</label>
        <input type="date" id="orderDate">

        <label>Notes</label>
        <textarea id="notes"></textarea>

        <button type="submit">
            Update Order
        </button>

    </form>

    <p id="message"></p>

</div>

<script src="js/app.js"></script>

</body>

</html>
