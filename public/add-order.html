<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Order - Strength Physio CRM</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <nav class="crm-nav">

        <a href="dashboard.html">📊 Dashboard</a>

        <a href="leads.html">👥 Leads</a>

        <a href="customers.html">🧑 Customers</a>

        <a href="orders.html">📦 Orders</a>
        <a href="payments.html">💰 Payments</a>

    </nav>

    <h1>Add New Order</h1>

    <form id="orderForm">

        <label>Customer</label>

        <select id="customer" required>

            <option value="">Select Customer</option>

        </select>


        <label>Assign Staff</label>
        <select id="assignedTo"><option value="">Myself</option></select>

        <label>Product</label>

        <input type="text" id="product" required>


        <label>Quantity</label>

        <input type="number" id="quantity" value="1" min="1" required>


        <label>Price</label>

        <input type="number" id="price" min="0" required>


        <label>Total Amount</label>

        <input type="number" id="totalAmount" min="0" required>


        <label>Amount Paid</label>
        <input type="number" id="amountPaid" min="0" value="0" required>
<label>Order Status</label>

        <select id="orderStatus">

            <option value="New">New</option>

            <option value="Processing">Processing</option>

            <option value="Dispatched">Dispatched</option>

            <option value="Delivered">Delivered</option>

            <option value="Cancelled">Cancelled</option>

        </select>


        <label>Order Date</label>

        <input type="date" id="orderDate">


        <label>Notes</label>

        <textarea id="notes"></textarea>


        <button type="submit">
            Add Order
        </button>

    </form>

    <p id="message"></p>

</div>

<script src="js/app.js"></script>

</body>

</html>
