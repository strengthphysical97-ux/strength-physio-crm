<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer History - Strength Physio CRM</title><link rel="stylesheet" href="css/style.css"><style>.history-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}.history-card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 4px 16px #0000000d}.history-card small{display:block;color:#666}.history-card strong{font-size:23px}.history-block{background:#fff;border-radius:14px;padding:18px;margin:18px 0;overflow:auto}.history-block table{width:100%;border-collapse:collapse}.history-block th,.history-block td{text-align:left;padding:10px;border-bottom:1px solid #eee;white-space:nowrap}@media(max-width:700px){.history-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head>
<body><div class="container"><nav class="crm-nav"><a href="dashboard.html">📊 Dashboard</a><a href="customers.html">🧑 Customers</a><a href="orders.html">📦 Orders</a><a href="payments.html">💰 Payments</a></nav><h1>Customer Purchase & Payment History</h1><p id="customerInfo">Loading customer...</p><div class="history-cards"><div class="history-card"><small>Total Orders</small><strong id="totalOrders">0</strong></div><div class="history-card"><small>Total Billing</small><strong id="totalBilling">₹0</strong></div><div class="history-card"><small>Total Paid</small><strong id="totalPaid">₹0</strong></div><div class="history-card"><small>Pending Balance</small><strong id="totalPending">₹0</strong></div></div><section class="history-block"><h2>Orders</h2><table><thead><tr><th>Date</th><th>Order</th><th>Product</th><th>Source</th><th>Billing</th><th>Paid</th><th>Pending</th><th>Status</th></tr></thead><tbody id="ordersRows"><tr><td colspan="8">Loading...</td></tr></tbody></table></section><section class="history-block"><h2>Payment Timeline</h2><table><thead><tr><th>Payment Date</th><th>Order</th><th>Product</th><th>Amount</th><th>Method</th><th>Note</th></tr></thead><tbody id="paymentRows"><tr><td colspan="6">Loading...</td></tr></tbody></table></section><p id="historyMessage"></p></div><script src="js/customer-history.js"></script></body></html>
