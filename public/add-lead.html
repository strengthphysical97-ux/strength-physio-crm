<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Strength Physio CRM - Add Lead</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Strength Physio CRM</h1>

        <h2>Add New Lead</h2>

        <form id="leadForm">

            <label>Customer Name</label>
            <input type="text" id="name" required>


            <label>Phone Number</label>
            <input type="text" id="phone" required>


            <label>Email <span class="field-optional">(Optional)</span></label>
            <input type="email" id="email">


            <label>Product Interested</label>
            <input type="text" id="product">


            <label>Lead Source</label>
            <select id="source" required>
                <option value="Instagram">Instagram</option>
                <option value="IndiaMART">IndiaMART</option>
                <option value="Justdial">Justdial</option>
                <option value="Meta Ads">Meta Ads</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="Website">Website</option>
                <option value="Referral">Referral</option>
                <option value="Facebook">Facebook</option>
                <option value="Google">Google</option>
                <option value="Other">Other</option>
            </select>

            <label>Source Type / Content</label>
            <select id="sourceType">
                <option value="">Select source type</option>
                <option value="Post">Post</option>
                <option value="Reel / Video">Reel / Video</option>
                <option value="Paid Advertisement">Paid Advertisement</option>
                <option value="Story">Story</option>
                <option value="Direct Message">Direct Message</option>
                <option value="Call">Call</option>
                <option value="Organic">Organic</option>
                <option value="Other">Other</option>
            </select>

            <label>Campaign / Post Name <span class="field-optional">(Optional)</span></label>
            <input type="text" id="campaignName" placeholder="e.g. Instagram Reel - October Offer">


            <label>Assign To Staff</label>
            <select id="assignedTo">
                <option value="">Loading staff...</option>
            </select>

            <label>Status</label>

            <select id="status">
                <option value="New">New</option>
                <option value="Contacted">Contacted</option>
                <option value="Interested">Interested</option>
                <option value="Follow-up">Follow-up</option>
                <option value="Converted">Converted</option>
                <option value="Lost">Lost</option>
            </select>


            <label>Follow-up Date</label>
            <input type="date" id="followUpDate">


            <label>Notes</label>
            <textarea id="notes"></textarea>


            <button type="submit">
                Add Lead
            </button>

        </form>

        <p id="message"></p>

    </div>


    <script src="js/app.js"></script>

</body>
</html>
